<!doctype html>
<!--
  STAGWELL — BRAND DIRECTORY (event prop)
  Internal performance aid for a live mentalism routine at a Stagwell event.
  The A-Z directory is procedurally generated filler; the scroll always
  terminates on the ten "Flagship Partners" used by the trick, in trick order.
  Flagship logos are lightweight inline-SVG recreations in brand colors so the
  page works fully offline (no venue-wifi dependency). Swap in official brand
  assets by replacing the entries in the LOGOS map below.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#003349">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stagwell">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<title>Stagwell — Our Brands</title>
<style>
  :root{
    --navy:#003349; --bg:#022630; --bg2:#04303f; --card:#0a3a4d; --card2:#0e4459;
    --ink:#eef6f8; --muted:#83a7b3; --line:rgba(255,255,255,.09);
    --gold:#FFB81C; --gold-dim:#c9922a;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:linear-gradient(180deg,#022630,#003349 60%,#022a36);
    background-attachment:fixed;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  .wrap{max-width:520px;margin:0 auto;min-height:100dvh}

  header{
    position:sticky;top:0;z-index:20;
    padding:calc(var(--safe-t) + 15px) 20px 15px;
    background:rgba(2,38,48,.85);backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid var(--line);
    transition:opacity .35s ease,transform .35s ease;
  }
  header.gone,.searchwrap.gone{opacity:0;transform:translateY(-100%);pointer-events:none}
  .brandbar{display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:800;font-size:21px;letter-spacing:.02em;display:flex;align-items:center;gap:9px}
  .logo .tick{width:7px;height:20px;background:var(--gold);border-radius:1px;box-shadow:0 0 10px rgba(255,184,28,.5)}
  .navpill{font-size:12px;color:var(--gold);border:1px solid rgba(255,184,28,.35);padding:6px 12px;border-radius:999px;font-weight:600}

  .hero{padding:26px 20px 18px}
  .kicker{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .hero h1{margin:12px 0 10px;font-size:34px;line-height:1.02;letter-spacing:-.035em;font-weight:800}
  .hero h1 em{font-style:normal;color:var(--gold)}
  .hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
  .stats{display:flex;gap:10px;margin-top:20px}
  .stat{flex:1;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:14px}
  .stat b{display:block;font-size:22px;letter-spacing:-.02em;color:#fff}
  .stat b i{font-style:normal;color:var(--gold)}
  .stat span{font-size:11.5px;color:var(--muted)}

  .searchwrap{position:sticky;top:calc(var(--safe-t) + 60px);z-index:15;padding:12px 20px;background:linear-gradient(#022630,rgba(2,38,48,.6) 70%,transparent);transition:opacity .35s ease,transform .35s ease}
  .search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .search svg{flex:none;opacity:.55}
  .search input{border:0;background:transparent;color:var(--ink);font-size:15px;width:100%;outline:none}
  .search input::placeholder{color:var(--muted)}

  .sectionlabel{padding:6px 20px 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

  .feed{padding:0 12px}
  .row{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:14px;content-visibility:auto;contain-intrinsic-size:auto 64px}
  .row:active{background:var(--card)}
  .mono{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;letter-spacing:-.02em}
  .meta{min-width:0}
  .name{font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat{font-size:12.5px;color:var(--muted);margin-top:2px}
  .chev{margin-left:auto;color:var(--muted);opacity:.45;flex:none}
  .hidden{display:none}
  .noresult{padding:40px 20px;text-align:center;color:var(--muted);display:none}

  /* logo tile */
  .tile{flex:none;width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.15)}
  .tile svg{width:100%;height:100%;display:block}

  /* Where the list settles: exactly one screen of ordinary-looking feed rows */
  .finale{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  .finale .flags{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .finale .row{flex:1 1 0;min-height:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brandbar">
      <div class="logo"><span class="tick"></span>STAGWELL</div>
      <div class="navpill">Our Network</div>
    </div>
  </header>

  <section class="hero">
    <div class="kicker">The Brand Directory</div>
    <h1>4,000 brands.<br><em>One network.</em></h1>
    <p>Every partner across Stagwell's agencies, platforms, and studios — in one place.</p>
    <div class="stats">
      <div class="stat"><b id="count">4,000</b><span>Active brands</span></div>
      <div class="stat"><b>70<i>+</i></b><span>Agencies</span></div>
      <div class="stat"><b>34</b><span>Countries</span></div>
    </div>
  </section>

  <div class="searchwrap">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" inputmode="search" placeholder="Search 4,000 brands…" autocomplete="off">
    </div>
  </div>

  <div class="sectionlabel">All partners</div>
  <div class="feed" id="feed"></div>

  <section class="finale" id="finale"><div class="flags" id="flags"></div></section>
</div>

<script>

    "Commerce","Health","Financial","Motors","Foods","Apparel","Beverages","Technologies","Robotics",
    "Aero","Energy","Capital","Retail","Sports","Games","Studios","Logistics","Devices","Wireless",
    "Nutrition","Cosmetics","Outfitters","Supply","& Sons","Holdings","Group Inc.","Bio"];

  // Trick brands — the scroll always ends on these ten, in trick order.
  var FLAGSHIP = ["PepsiCo","Starbucks","Target","Apple","The Coca-Cola Company",
    "National Football League","Stellantis","General Mills","Delta Air Lines","United Airlines"];
  var FLAGCAT = {
    "PepsiCo":"Food & Beverage","Starbucks":"Food & Beverage","Target":"Retail",
    "Apple":"Technology","The Coca-Cola Company":"Food & Beverage",
    "National Football League":"Sports","Stellantis":"Automotive",
    "General Mills":"Consumer Goods","Delta Air Lines":"Travel & Aviation",
    "United Airlines":"Travel & Aviation"};

  // Inline-SVG logo recreations (brand colors). Replace with official assets as desired.
  var LOGOS = {
    "PepsiCo":'<svg viewBox="0 0 44 44"><defs><clipPath id="pep"><circle cx="22" cy="22" r="20"/></clipPath></defs><g clip-path="url(#pep)"><rect width="44" height="44" fill="#fff"/><path d="M0 0 H44 V21 Q22 13 0 21 Z" fill="#e32934"/><path d="M0 44 H44 V23 Q22 31 0 23 Z" fill="#004b93"/></g><circle cx="22" cy="22" r="20" fill="none" stroke="#eee"/></svg>',
    "Starbucks":'<svg viewBox="0 0 44 44"><rect width="44" height="44" fill="#fff"/><circle cx="22" cy="22" r="19" fill="#006241"/><circle cx="22" cy="22" r="19" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="22" cy="22" r="13.5" fill="none" stroke="#fff" stroke-width="1.2"/><circle cx="22" cy="11.5" r="1.4" fill="#fff"/><circle cx="13.5" cy="15" r="1" fill="#fff"/><circle cx="30.5" cy="15" r="1" fill="#fff"/><path d="M22 15c-4.2 0-6.4 3.1-6.4 6.4 0 3.2 2.2 5.4 3.4 7.4-2.2-1-3.6-3.2-3.6-5.4M22 15c4.2 0 6.4 3.1 6.4 6.4 0 3.2-2.2 5.4-3.4 7.4 2.2-1 3.6-3.2 3.6-5.4" fill="none" stroke="#fff" stroke-width="1.2"/></svg>',

    "Apple":'<svg viewBox="0 0 44 44"><rect width="44" height="44" fill="#fff"/><g transform="translate(10 8) scale(1)" fill="#1d1d1f"><path d="M17.05 12.54c-.03-2.6 2.12-3.85 2.22-3.91-1.21-1.77-3.09-2.02-3.76-2.05-1.6-.16-3.12.94-3.93.94-.81 0-1.72-.92-2.83-.9-1.46.02-2.8.85-3.55 2.16-1.51 2.63-.39 6.53 1.09 8.67.72 1.05 1.58 2.22 2.71 2.18 1.09-.04 1.5-.7 2.82-.7 1.31 0 1.68.7 2.83.68 1.17-.02 1.91-1.07 2.63-2.12.82-1.22 1.16-2.4 1.18-2.46-.03-.01-2.26-.87-2.28-3.44"/><path d="M14.53 4.85c.6-.73 1.01-1.74.9-2.75-.87.04-1.92.58-2.54 1.31-.56.65-1.05 1.68-.92 2.67.97.08 1.96-.5 2.56-1.23z"/></g></svg>',
    "The Coca-Cola Company":'<svg viewBox="0 0 44 44"><rect width="44" height="44" fill="#f40009"/><path d="M5 27q10-7 18-3 8 4 16-2-2 3-5 4.5-6.5 3.5-13 .6-6-2.6-12 3.2-2-.7-4-.9z" fill="#fff" opacity=".92"/><text x="22" y="17" text-anchor="middle" font-family="Snell Roundhand,Brush Script MT,cursive" font-style="italic" font-weight="700" font-size="10" fill="#fff">Coca-Cola</text></svg>',

  function initial(name){ var m=name.replace(/[^A-Za-z]/g,""); return (m[0]||"S").toUpperCase(); }
  function catFor(name){ var h=0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0; return CATS[h%CATS.length]; }
  function colorFor(name){ var h=0; for(var i=0;i<name.length;i++) h=(h*17+name.charCodeAt(i))>>>0; return COLORS[h%COLORS.length]; }

  // ---- build a shuffled filler pool (a discovery feed, NOT alphabetical) ----
  var seen={}, pool=[];
  FLAGSHIP.forEach(function(f){ seen[f.toLowerCase()]=1; });
  var guard=0;
  while(pool.length<3990 && guard<80000){
    guard++;
    var nm = rnd()<0.5 ? (pick(PRE)+" "+pick(SUF)) : (pick(PRE)+pick(["","","","x","io","ly","co"])+" "+pick(SUF));
    var k=nm.toLowerCase(); if(!seen[k]){ seen[k]=1; pool.push(nm); }
  }
  for(var s=pool.length-1;s>0;s--){ var rr=Math.floor(rnd()*(s+1)),tp=pool[s]; pool[s]=pool[rr]; pool[rr]=tp; }

  var feed=document.getElementById("feed"), pidx=0;
  function rowHTML(n){
    return '<div class="row" data-n="'+n.toLowerCase()+'">'
      +'<div class="tile">'+genLogo(n)+'</div>'

  }
  function appendBatch(count){
    var h=""; for(var i=0;i<count;i++){ h+=rowHTML(pool[pidx++ % pool.length]); }
    feed.insertAdjacentHTML("beforeend", h);
  }
  appendBatch(45);

  // ---- the ten (built, then parked off-DOM until the user stops) ----
  // the ten are rendered as ordinary feed rows (no header, no numbers) so a stop
  // looks like any random stop in the endless list
  var flags=document.getElementById("flags"), fh="";
  for(var j=0;j<FLAGSHIP.length;j++){
    var fn=FLAGSHIP[j];
    fh+='<div class="row"><div class="tile">'+LOGOS[fn]+'</div>'
      +'<div class="meta"><div class="name">'+fn+'</div><div class="cat">'+(FLAGCAT[fn]||catFor(fn))+'</div></div>'
      +'<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>';
  }
  flags.innerHTML=fh;
  var finale=document.getElementById("finale");
  if(finale.parentNode) finale.parentNode.removeChild(finale);

  // ---- header/search hide on downward scroll (standard feed behavior) so the
  //      settle screen matches any other downward-scroll stop ----
  var hdr=document.querySelector("header"), sw=document.querySelector(".searchwrap"), lastY=window.scrollY;
  function setChrome(hide){ hdr.classList.toggle("gone",hide); sw.classList.toggle("gone",hide); }

  // ---- the force: wherever the user stops, the list settles on the ten ----
  var gliding=false, stopT=null, glideT=null;
  function firstRowBelowFold(){
    var vpB=window.scrollY+window.innerHeight, kids=feed.children;
    for(var i=0;i<kids.length;i++){ if(kids[i]!==finale && kids[i].offsetTop>=vpB) return kids[i]; }
    return null;
  }
  function settleOnTen(){
    gliding=true;
    // detach from a prior spot (compensate scroll if it was above the viewport)
    if(finale.parentNode){
      var r=finale.getBoundingClientRect(), h=finale.offsetHeight, wasAbove=r.bottom<=0;
      finale.parentNode.removeChild(finale);
      if(wasAbove) window.scrollBy(0,-h);
    }
    // guarantee filler exists below the fold, then drop the panel just past it
    var safety=0;
    while(safety++<30){
      var last=feed.lastElementChild;
      if(!last || last.offsetTop >= window.scrollY+window.innerHeight*2) break;
      appendBatch(25);
    }
    var anchor=firstRowBelowFold();
    if(anchor) feed.insertBefore(finale,anchor); else feed.appendChild(finale);
    finale.scrollIntoView({behavior:"smooth",block:"start"});
    clearTimeout(glideT); glideT=setTimeout(function(){ gliding=false; },850);
  }
  function realignTen(){        // gently re-settle the panel in place (no DOM move, no jump)
    gliding=true;
    finale.scrollIntoView({behavior:"smooth",block:"start"});
    clearTimeout(glideT); glideT=setTimeout(function(){ gliding=false; },700);
  }
  function armStop(){
    clearTimeout(stopT);
    stopT=setTimeout(function(){
      if(gliding) return;
      if(window.scrollY < window.innerHeight*0.6) return; // still at the very top
      var H=window.innerHeight;
      if(finale.parentNode){
        var r=finale.getBoundingClientRect();
        if(r.bottom>2 && r.top<H-2){            // the ten are already (partly) on screen
          var vis=Math.min(r.bottom,H)-Math.max(r.top,0);
          if(vis < H-3) realignTen();           // nudge them to fill the screen; skip if already full
          return;                                // never detach/reposition while they're visible
        }
      }
      settleOnTen();                             // only when the ten are absent / fully off-screen
    },430);
  }
  window.addEventListener("scroll",function(){
    if(gliding) return;
    var y=window.scrollY;
    if(y>lastY+4 && y>120) setChrome(true);      // scrolling down → hide chrome
    else if(y<lastY-4) setChrome(false);          // scrolling up → show chrome
    lastY=y;
    if(y+window.innerHeight > document.documentElement.scrollHeight-1600) appendBatch(30);
    armStop();
  },{passive:true});
  // any real user input cancels an in-progress settle so scrolling always responds
  ["touchstart","wheel","pointerdown"].forEach(function(ev){
    window.addEventListener(ev,function(){ if(gliding){ gliding=false; clearTimeout(glideT); } },{passive:true});
  });

  // ---- search filters the loaded rows (the ten are unaffected) ----
  var q=document.getElementById("q"), t;
  q.addEventListener("input",function(){
    clearTimeout(t);
    t=setTimeout(function(){
      var v=q.value.trim().toLowerCase(), rows=feed.getElementsByClassName("row");
      for(var i=0;i<rows.length;i++){ rows[i].classList.toggle("hidden", !!v && rows[i].getAttribute("data-n").indexOf(v)===-1); }
    },90);
  });
})();
</script>
</body>
</html>
